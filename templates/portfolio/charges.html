{% extends "base.html" %}{% block content %}<div class="heading"><div><span class="eyebrow">ФИНАНСОВЫЙ КОНТРОЛЬ</span><h1>Платежи и налоги<span class="dot">.</span></h1><p class="muted">Аренда, коммунальные счета, расходы и обязательства.</p></div><a class="btn" href="{% url 'create' 'charge' %}">＋ Новое обязательство</a></div><form method="get" class="filters"><label>Город<select name="city"><option value="">Все города</option>{% for key,label in cities %}<option value="{{ key }}" {% if request.GET.city == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Квартира<select name="property"><option value="">Все квартиры</option>{% for p in properties %}<option value="{{ p.pk }}"
        {% if request.GET.property == p.pk|stringformat:'s' %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></label><label>Категория<select name="kind"><option value="">Все категории</option>{% for key,label in kinds %}<option value="{{ key }}" {% if request.GET.kind == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Статус<select name="state"><option value="">Все статусы</option><option value="open" {% if request.GET.state == 'open' %}selected{% endif %}>К оплате</option><option value="overdue"
        {% if request.GET.state == 'overdue' %}selected{% endif %}>Просрочено</option><option value="paid" {% if request.GET.state == 'paid' %}selected{% endif %}>Оплачено</option></select></label><button class="btn secondary">Показать</button></form><div class="section-heading"><span class="muted">Найдено: {{ charges|length }}</span><a class="text-link"
   href="{% url 'export' %}?{{ request.GET.urlencode }}">Скачать CSV ↓</a></div>{% include "portfolio/table.html" %}{% endblock %}
